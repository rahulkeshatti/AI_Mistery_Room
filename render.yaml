services:
  - type: web
    name: ai-mystery-room-api
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm ci && npm run build -w server
    startCommand: npm run start -w server
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_TIMEOUT_MS
        value: "60000"
      - key: GEMINI_MAX_RETRIES
        value: "2"
      - key: MAX_SCENARIO_LENGTH
        value: "3000"
      - key: MAX_SUSPECT_COUNT
        value: "6"
      - key: MAX_EVIDENCE_ITEMS
        value: "30"
